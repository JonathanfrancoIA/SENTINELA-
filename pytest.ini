[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
markers =
    slow: testes lentos (treino de modelo, etc.)
    integration: testes de integração (requerem banco ou rede)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
